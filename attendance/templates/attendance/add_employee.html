{% extends "attendance/base.html" %}
{% block title %}Add Employee{% endblock %}
{% block content %}
<div class="page-heading"><div><h2>Add Employee</h2><p>Salary cycle starts from the joining date.</p></div><a class="btn btn-light" href="{% url 'dashboard' %}">Back</a></div>
<div class="card"><div class="card-body"><form method="post">{% csrf_token %}<div class="form-grid">
<div class="form-group"><label>Employee ID</label><input name="employee_id" required></div>
<div class="form-group"><label>Employee Name</label><input name="name" required></div>
<div class="form-group"><label>Phone Number</label><input name="phone" required></div>
<div class="form-group"><label>Designation</label><input name="designation"></div>
<div class="form-group"><label>Email</label><input type="email" name="email"></div>
<div class="form-group"><label>Address</label><input name="address"></div>
<div class="form-group"><label>Joining Date</label><input type="date" name="joining_date" required></div>
<div class="form-group"><label>Hourly Rate (₹)</label><input type="number" name="hourly_rate" min="0" step="0.01" required></div>
<div class="form-group"><label>Status</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
</div><div class="form-actions"><button class="btn btn-primary">Save Employee</button><a class="btn btn-light" href="{% url 'dashboard' %}">Cancel</a></div></form></div></div>
{% endblock %}
